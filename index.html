<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Buscador de Estoque</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('tema');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
          document.documentElement.setAttribute('data-theme', t === 'escuro' ? 'dark' : 'light');
        } catch (e) {}

        // iOS ignora user-scalable=no; bloqueio zoom por JS.
        var stop = function (e) { e.preventDefault(); };
        document.addEventListener('gesturestart', stop, { passive: false });
        document.addEventListener('gesturechange', stop, { passive: false });
        document.addEventListener('gestureend', stop, { passive: false });

        // Toque-duplo nas gavetas (só nelas; não afeta +/- nem itens do painel).
        var lt = 0, lx = 0, ly = 0;
        document.addEventListener('touchend', function (e) {
          var tt = e.changedTouches && e.changedTouches[0];
          if (!tt) return;
          var now = Date.now();
          var naGaveta = e.target && e.target.closest && e.target.closest('.rk-drawer');
          if (naGaveta && now - lt < 500 && Math.abs(tt.clientX - lx) < 60 && Math.abs(tt.clientY - ly) < 60) {
            e.preventDefault();
          }
          lt = now; lx = tt.clientX; ly = tt.clientY;
        }, { passive: false });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
